
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Your results summary">
    <title>Results Summary</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="results-container">

        <!-- Result panel -->
        <section class="result-panel">
            <h1>Your Result</h1>

            <div class="score-circle">
                <span class="total-score">76</span>
                <span class="score-out-of">of 100</span>
            </div>

            <div class="result-description">
                <h2>Great</h2>
                <p>
                    You scored higher than 65% of the people
                    who have taken these tests.
                </p>
            </div>
        </section>

        <!-- Summary panel -->
        <section class="summary-panel">

            <h2 class="summary-heading">Summary</h2>

            <div class="summary-list">

                <div class="summary-item reaction">
                    <div class="category">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M13 2 4 14h7l-1 8 10-13h-7l1-7Z"/>
                        </svg>
                        <span>Reaction</span>
                    </div>
                    <p class="score"><strong>80</strong><span>/ 100</span></p>
                </div>

                <div class="summary-item memory">
                    <div class="category">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M9 4a3 3 0 0 0-5 2 3 3 0 0 0-1 5 3 3 0 0 0 1 5 3 3 0 0 0 5 2"/>
                            <path d="M15 4a3 3 0 0 1 5 2 3 3 0 0 1 1 5 3 3 0 0 1-1 5 3 3 0 0 1-5 2"/>
                            <path d="M9 4v16M15 4v16M9 8H6m9 0h3M9 13H6m9 0h3"/>
                        </svg>
                        <span>Memory</span>
                    </div>
                    <p class="score"><strong>92</strong><span>/ 100</span></p>
                </div>

                <div class="summary-item verbal">
                    <div class="category">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9h.5a8.5 8.5 0 0 1 8 8v.5Z"/>
                            <path d="M8 12h8"/>
                        </svg>
                        <span>Verbal</span>
                    </div>
                    <p class="score"><strong>61</strong><span>/ 100</span></p>
                </div>

                <div class="summary-item visual">
                    <div class="category">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                        <span>Visual</span>
                    </div>
                    <p class="score"><strong>73</strong><span>/ 100</span></p>
                </div>

            </div>

            <button class="continue-button" type="button">
                Continue
            </button>

        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>
